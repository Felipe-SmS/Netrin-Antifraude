services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: antifraude
      POSTGRES_USER: antifraude
      POSTGRES_PASSWORD: ${DB_PASSWORD:-antifraude_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antifraude -d antifraude"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: